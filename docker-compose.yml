services:
  minecraft-bot-bob:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minecraft-bot-bob
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MINECRAFT_USERNAME=BobBot
      # For Linux, use the special Docker DNS name
      # - MINECRAFT_HOST=host.docker.internal
      # Use the IP address of the host machine
      - MINECRAFT_HOST=192.168.1.131
      - MINECRAFT_ROLE=builder
      - NEVERMINED_API_KEY=${BOB_NEVERMINED_API_KEY}
      - PRIVATE_KEY=${BOB_PRIVATE_KEY}
      - NEVERMINED_AGENT_DID=${BOB_NEVERMINED_AGENT_DID}
      - NEVERMINED_PAYMENT_PLAN_DID=${BOB_NEVERMINED_PAYMENT_PLAN_DID}

    ports:
      - '3001:3001'
    volumes:
      - shared_data:/app/server/data
    networks:
      - minecraft-network
    # For Linux, add this to make host.docker.internal work
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  minecraft-bot-alice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minecraft-bot-alice
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3002
      - MINECRAFT_USERNAME=AliceBot
      # For Linux, use the special Docker DNS name
      # - MINECRAFT_HOST=host.docker.internal
      # Use the IP address of the host machine
      - MINECRAFT_HOST=192.168.1.131
      - MINECRAFT_ROLE=merchant
      - NEVERMINED_API_KEY=${ALICE_NEVERMINED_API_KEY}
      - PRIVATE_KEY=${ALICE_PRIVATE_KEY}
      - NEVERMINED_AGENT_DID=${ALICE_NEVERMINED_AGENT_DID}
      - NEVERMINED_PAYMENT_PLAN_DID=${ALICE_NEVERMINED_PAYMENT_PLAN_DID}
    ports:
      - '3002:3002'
    volumes:
      - shared_data:/app/server/data
    networks:
      - minecraft-network
    # For Linux, add this to make host.docker.internal work
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  shared_data:

networks:
  minecraft-network:
    driver: bridge
